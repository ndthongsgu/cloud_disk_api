[package]
name = "cloud_disk_api"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "tls-native-tls", "macros", "uuid", "chrono"] }
dotenvy = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tracing = "0.1"
tracing-actix-web = "0.6"
tracing-log = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "time", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9.3"
bcrypt = "0.15"
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
bytes = "1"
actix-cors = "0.7.1"
actix-multipart = "0.7.2"
futures-util = "0.3"

